    <path d="m428 514 52-30 52 30c12 7 12 25 0 32l-52 30-52-30c-12-7-12-25 0-32Z" fill="#241f68" fill-opacity=".24" />
  </g>

  <circle cx="781" cy="264" r="38" fill="#efb348" fill-opacity=".22" />
  <path d="M763 264h36M781 246v36" stroke="#b87913" stroke-linecap="round" stroke-width="7" />
  <circle cx="858" cy="579" r="15" fill="#4fb783" />
  <circle cx="431" cy="170" r="10" fill="#e45e77" />
