    <path class="muted-line" d="M190 818h82" stroke="#a39ead" stroke-linecap="round" stroke-width="8" />
    <path class="muted-line" d="M142 866h168" stroke="#a39ead" stroke-linecap="round" stroke-width="8" />
  </g>

