    <path d="m718 774 38-22 38 22v44l-38 22-38-22v-44Z" fill="none" stroke="#6258e8" stroke-linejoin="round" stroke-width="8" />
    <path d="m718 774 38 22 38-22M756 796v44" fill="none" stroke="#6258e8" stroke-linejoin="round" stroke-width="8" />
