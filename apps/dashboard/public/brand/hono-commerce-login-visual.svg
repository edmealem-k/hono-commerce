<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 1120"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Hono Commerce workspace illustration</title>
  <desc id="description">
    An abstract commerce gateway connecting store, product, and order surfaces.
  </desc>
  <defs>
    <linearGradient id="canvas" x1="120" y1="80" x2="850" y2="1030" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f2ff" />
      <stop offset="1" stop-color="#e8e6f7" />
    </linearGradient>
    <linearGradient id="portalLeft" x1="320" y1="286" x2="500" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3027df" />
      <stop offset="1" stop-color="#5650ee" />
    </linearGradient>
    <linearGradient id="portalRight" x1="640" y1="286" x2="460" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8068f5" />
      <stop offset="1" stop-color="#5f4ce8" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#241f68" flood-opacity=".12" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#6b63b5" stroke-opacity=".09" />
    </pattern>
    <style>
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #272535; }
        .grid { opacity: .32; }
        .orbit { stroke: #9288dc; }
        .surface { fill: #343141; stroke: #504b65; }
        .muted-line { stroke: #77718a; }
        .strong-line { stroke: #b7b0c9; }
      }
    </style>
  </defs>

  <rect class="canvas" x="24" y="24" width="912" height="1072" rx="64" fill="url(#canvas)" />
  <rect class="grid" x="24" y="24" width="912" height="1072" rx="64" fill="url(#grid)" />

  <path class="orbit" d="M122 727C222 901 450 1000 664 922c177-64 278-246 236-425" fill="none" stroke="#6c62b6" stroke-opacity=".18" stroke-width="2" stroke-dasharray="10 14" />
  <path class="orbit" d="M91 434c56-186 239-318 433-303 188 15 339 160 368 337" fill="none" stroke="#6c62b6" stroke-opacity=".16" stroke-width="2" />

  <g filter="url(#shadow)">
