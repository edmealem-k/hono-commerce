    <circle cx="153" cy="798" r="20" fill="#5148e5" fill-opacity=".14" />
    <path d="m143 798 7 7 14-16" fill="none" stroke="#5148e5" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" />
